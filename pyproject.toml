[build-system]
requires = [
    "scikit-build-core",
    "numpy>=2.0",
    "pybind11",
    "pybind11-stubgen",
    "packaging",
]
build-backend = "scikit_build_core.build"

[project]
name = "gnuradio"
version = "3.10.12.0"
dependencies = [
    "numpy>=1.26"
]

[tool.scikit-build]
build.verbose = true
cmake.version = ">=3.24"
